# Build half of the PR-preview family: renders the manuscript in the (possibly
# fork) PR context and uploads it + PR metadata as an artifact. The deploy half
# (preview-deploy.yml) publishes it to gh-pages. This job is read-only
# (contents: read) -- it must never write to the base repo.
#
# IMPORTANT: keep this workflow's `name:` in sync with the `workflows:` list in
# preview-deploy.yml -- that's how the deploy half finds this run.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809). The reusable workflow
# already cancels a superseded preview build for the same ref.
name: Quarto Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

jobs:
  build:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/preview.yml@v3
    with:
      # Non-renv repo: install the packages the manuscript's chunks load.
      use-renv: false
      r-packages: |
        any::knitr
        any::rmarkdown
        any::tibble
        any::ggplot2
      # This repo has a DESCRIPTION for lintr and tooling, but pages do not
      # call its functions, and the old workflow never installed it.
      install-package: false
      apt-packages: ''
      setup-chrome: false
      # PDF output is part of the default render below, so TinyTeX is always needed.
      tinytex: true
      # A manuscript project has no `website` profile.
      render-profile: ''
      output-dir: _manuscript
      # One bare `quarto render` of every format _quarto.yml declares (html, pdf,
      # docx, jats), so any slide-deck (revealjs) format added later is built in
      # previews too. Never leave this empty: empty selects a legacy branch that
      # renders html plus only the formats requested by `preview:*` labels.
      formats: default
      timezone: America/Los_Angeles
      # Rebuild when this label is added or removed (it toggles highlighting below).
      extra-preview-labels: '["no-preview-highlights"]'
      # Compare against the published render: highlight changed text and build Word
      # files with tracked changes. Highlighting is off while the PR carries the
      # `no-preview-highlights` label. The banner linking changed pages and each
      # page's other formats is added by the `page-banners` job below.
      highlight-changes: ${{ !contains(github.event.pull_request.labels.*.name, 'no-preview-highlights') }}
      docx-tracked-changes: true
      # The article (index) and the notebooks/ pages, which gha's default
      # `chapters/*.html` and `chapters/*.docx` would miss.
      changed-chapters-glob: '**/*.html'
      docx-tracked-changes-glob: '**/*.docx'

  # gha has no per-page banner linking a page's tracked-changes Word file and slide
  # deck, nor one listing the changed pages on every page, so this keeps the repo's
  # own script (gha#1025). It edits the staged artifact before the deploy workflow
  # (which runs only after this whole workflow finishes) publishes it. Same trust
  # level as the build job: read-only token, PR code.
  page-banners:
    needs: build
    if: github.event.action != 'closed' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download preview artifact
        uses: actions/download-artifact@v5
        with:
          name: pr-preview-site
          path: preview_artifact/
      - name: Add banners to preview pages
        # The script exits 0 when HTML_DIR is missing, which would pass CI with
        # no banners; fail here instead. gha's artifact holds `site/` (the
        # rendered output-dir) and `meta/` at its root (gha preview/action.yml,
        # "Stage site for upload").
        run: |
          set -euo pipefail
          if [ ! -f "$HTML_DIR/index.html" ]; then
            echo "::error::$HTML_DIR/index.html is missing; the preview artifact layout changed"
            exit 1
          fi
          python3 .github/scripts/add-home-banner.py
        env:
          HTML_DIR: preview_artifact/site
          HIGHLIGHT_CHANGES: ${{ !contains(github.event.pull_request.labels.*.name, 'no-preview-highlights') }}
      - name: Replace preview artifact
        # Same upload as gha's (preview/action.yml, "Upload preview artifact"),
        # which sets no include-hidden-files: the artifact never held dotfiles,
        # so none are dropped here.
        uses: actions/upload-artifact@v5
        with:
          name: pr-preview-site
          path: preview_artifact/
          overwrite: true
          retention-days: 1
